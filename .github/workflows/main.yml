name: Run Test

on:
  push:
    branches: [dev]
  pull_request: 
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install dependencies
        run: npm install
        working-directory: backend

      - name: Run tests
        run: npm test
        working-directory: backend
   
      - name: Run eslint
        run: npm run lint
        working-directory: backend
        
      - name: Run Prettier
        run : npm run format
        working-directory: backend
        
